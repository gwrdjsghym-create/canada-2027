name: Website zu IONOS übertragen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload per SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: SFTP-Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Website prüfen und vorbereiten
        env:
          SITE_PIN: ${{ secrets.SITE_PIN }}
        run: |
          set -euo pipefail
          test -n "$SITE_PIN"
          for file in *.php; do php -l "$file"; done

          RELEASE_VERSION="${GITHUB_SHA::12}"
          RELEASE_VERSION="$RELEASE_VERSION" perl -0pi -e 's{(styles\.css|app\.js|dashboard\.js)\?v=[^"&<\s]+}{$1 . "?v=" . $ENV{RELEASE_VERSION}}ge' -- *.php
          perl -0pi -e 's{target="_blank"(?!\s+rel=)}{target="_blank" rel="noopener"}g' -- *.php

          PIN_SALT="$(openssl rand -hex 16)"
          PIN_HASH="$(PIN_SALT="$PIN_SALT" php -r 'echo hash_pbkdf2("sha256", getenv("SITE_PIN"), getenv("PIN_SALT"), 210000, 64);')"
          printf "<?php return ['pinSalt' => '%s', 'pinHash' => '%s', 'pinIterations' => 210000];\n" "$PIN_SALT" "$PIN_HASH" > site-config.php

      - name: Website zu IONOS übertragen
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' 'put .htaccess'
            find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.php' -o -name '*.css' -o -name '*.js' \) -printf '%f\n' | sort | while IFS= read -r file; do
              printf 'put "%s"\n' "$file"
            done
            for directory in assets pdfs; do
              printf -- '-mkdir "%s"\n' "$directory"
              find "$directory" -maxdepth 1 -type f -printf '%p\n' | sort | while IFS= read -r file; do
                printf 'put "%s" "%s"\n' "$file" "$file"
              done
            done
            printf '%s\n' \
              '-rm assets/andrea-lars-memoji.png' \
              '-rm assets/christina-manfred-memoji.png' \
              'bye'
          } > "$RUNNER_TEMP/sftp-commands"

          sshpass -e sftp \
            -P 22 \
            -o BatchMode=no \
            -o StrictHostKeyChecking=accept-new \
            -b "$RUNNER_TEMP/sftp-commands" \
            "$SFTP_USERNAME@$SFTP_HOST"
