name: Website zu IONOS übertragen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload per SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: SFTP-Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Website zu IONOS übertragen
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          printf '%s\n' \
            'put index.html' \
            'put styles.css' \
            'put app.js' \
            '-mkdir assets' \
            'put assets/andrea-lars-memoji.png assets/andrea-lars-memoji.png' \
            'put assets/christina-manfred-memoji.png assets/christina-manfred-memoji.png' \
            '-mkdir pdfs' \
            'put pdfs/00_Vergleich_Aktivitaeten_Mauricie.pdf pdfs/00_Vergleich_Aktivitaeten_Mauricie.pdf' \
            'put pdfs/01_Lac-Solitaire.pdf pdfs/01_Lac-Solitaire.pdf' \
            'put pdfs/02_Ruisseau-Bouchard.pdf pdfs/02_Ruisseau-Bouchard.pdf' \
            'put pdfs/03_Cascades-und-Falaises.pdf pdfs/03_Cascades-und-Falaises.pdf' \
            'put pdfs/04_Kanu-Einfuehrung.pdf pdfs/04_Kanu-Einfuehrung.pdf' \
            'put pdfs/05_Chutes-Waber.pdf pdfs/05_Chutes-Waber.pdf' \
            'put pdfs/06_Shawinigan-und-Cite-de-lEnergie.pdf pdfs/06_Shawinigan-und-Cite-de-lEnergie.pdf' \
            'bye' > "$RUNNER_TEMP/sftp-commands"

          sshpass -e sftp \
            -P 22 \
            -o BatchMode=no \
            -o StrictHostKeyChecking=accept-new \
            -b "$RUNNER_TEMP/sftp-commands" \
            "$SFTP_USERNAME@$SFTP_HOST"
