name: Website zu IONOS übertragen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload per SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: SFTP-Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Website zu IONOS übertragen
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SITE_PIN: ${{ secrets.SITE_PIN }}
        run: |
          test -n "$SITE_PIN"
          for file in *.php; do php -l "$file"; done
          PIN_SALT="$(openssl rand -hex 16)"
          PIN_HASH="$(PIN_SALT="$PIN_SALT" php -r 'echo hash_pbkdf2("sha256", getenv("SITE_PIN"), getenv("PIN_SALT"), 210000, 64);')"
          printf "<?php return ['pinSalt' => '%s', 'pinHash' => '%s', 'pinIterations' => 210000];\n" "$PIN_SALT" "$PIN_HASH" > site-config.php

          printf '%s\n' \
            'put .htaccess' \
            'put index.html' \
            'put index.php' \
            'put 01-montreal.html' \
            'put 01-montreal.php' \
            'put 02-the-laurentians.html' \
            'put 02-the-laurentians.php' \
            'put 03-sainte-rose-du-nord.html' \
            'put 03-sainte-rose-du-nord.php' \
            'put 03-transfer-23-09.php' \
            'put transfer-vote.php' \
            'put 04-quebec-city.html' \
            'put 04-quebec-city.php' \
            'put 05-orford.html' \
            'put 05-orford.php' \
            'put styles.css' \
            'put app.js' \
            'put auth-lib.php' \
            'put auth.php' \
            'put login.php' \
            'put logout.php' \
            'put site-config.php' \
            'put protected-asset.php' \
            'put checklists.php' \
            'put ideas.php' \
            'put idea.php' \
            'put new-idea.php' \
            'put idea-file.php' \
            'put file.php' \
            'put destination-template.php' \
            '-mkdir assets' \
            'put assets/andrea-lars-memoji.png assets/andrea-lars-memoji.png' \
            'put assets/christina-manfred-memoji.png assets/christina-manfred-memoji.png' \
            '-mkdir pdfs' \
            'put pdfs/00_Vergleich_Aktivitaeten_Mauricie.pdf pdfs/00_Vergleich_Aktivitaeten_Mauricie.pdf' \
            'put pdfs/01_Lac-Solitaire.pdf pdfs/01_Lac-Solitaire.pdf' \
            'put pdfs/02_Ruisseau-Bouchard.pdf pdfs/02_Ruisseau-Bouchard.pdf' \
            'put pdfs/03_Cascades-und-Falaises.pdf pdfs/03_Cascades-und-Falaises.pdf' \
            'put pdfs/04_Kanu-Einfuehrung.pdf pdfs/04_Kanu-Einfuehrung.pdf' \
            'put pdfs/05_Chutes-Waber.pdf pdfs/05_Chutes-Waber.pdf' \
            'put pdfs/06_Shawinigan-und-Cite-de-lEnergie.pdf pdfs/06_Shawinigan-und-Cite-de-lEnergie.pdf' \
            'put pdfs/03-00_Sainte-Rose-du-Nord_Uebersicht.pdf pdfs/03-00_Sainte-Rose-du-Nord_Uebersicht.pdf' \
            '-rm pdfs/03-01_Montagne-du-Chapeau_24-09-2027.pdf' \
            'put pdfs/03-01_Montagne-du-Chapeau_02-Standard_NEU.pdf pdfs/03-01_Montagne-du-Chapeau_02-Standard_NEU.pdf' \
            'put pdfs/03-02_Fjordtag_25-09-2027_Varianten.pdf pdfs/03-02_Fjordtag_25-09-2027_Varianten.pdf' \
            '-rm pdfs/03-03_Pic-de-la-Tete-de-Chien_26-09-2027.pdf' \
            'put pdfs/03-03_Pic-de-la-Tete-de-Chien_02-Standard_NEU.pdf pdfs/03-03_Pic-de-la-Tete-de-Chien_02-Standard_NEU.pdf' \
            'bye' > "$RUNNER_TEMP/sftp-commands"

          sshpass -e sftp \
            -P 22 \
            -o BatchMode=no \
            -o StrictHostKeyChecking=accept-new \
            -b "$RUNNER_TEMP/sftp-commands" \
            "$SFTP_USERNAME@$SFTP_HOST"
